<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio Seccion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <!-- Contenedor principal -->
     <div class="auth-wrapper">
        <div class="auth-container">
            <h2 class="auth-title">Iniciar Sesión</h2>
            <form action="#" method="post">
                <div class="form-grupo">
                    <label for="email" class="form-letra">Correo Electrónico</label>
                    <input type="email" id="email" name="email" class="form-control" required placeholder="ejemple@correo.com">
                </div>

                <div class="form-grupo">
                    <label for="contrasena" class="form-letra">Contraseña</label>
                    <input type="contrasena" id="contrasena" class="form-control" required placeholder="********">
                </div>

                <button type="submit" class="btn-primary auth-btn">Ingresar</button>
            </form>

            <div class="auth-links">
                ¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a>
            </div>
        </div>
     </div>
</body>
</html>
