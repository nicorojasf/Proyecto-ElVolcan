spring.application.name=order-service
server.port=8083

# Base de datos (en Docker se sobreescribe con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_pedidos}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT: se verifica con el MISMO secreto con que auth-service firma. Sin valor por defecto a propósito.
jwt.secret=${JWT_SECRET}

# product-service: de ahí salen precios y stock
app.productos.url=${PRODUCT_SERVICE_URL:http://localhost:8081}

# CORS: solo mientras React llame directo a este servicio (se quita al poner el Gateway)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

springdoc.swagger-ui.path=/swagger-ui.html

# Clave compartida con product-service (cabecera X-Internal-Key) para descontar/aumentar stock.
app.productos.internal-key=${INTERNAL_API_KEY}
