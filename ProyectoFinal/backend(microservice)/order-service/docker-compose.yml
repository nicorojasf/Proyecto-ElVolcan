services:
  db-pedidos:
    image: postgres:16
    container_name: db-pedidos
    environment:
      POSTGRES_DB: db_pedidos
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5434:5432"   # 5434 en tu PC para no chocar con productos (5432) ni usuarios (5433)
    volumes:
      - pgdata-pedidos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d db_pedidos"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-service:
    build: .
    container_name: order-service
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:postgresql://db-pedidos:5432/db_pedidos
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # Exactamente el mismo valor que usa auth-service
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env}
      # Para correr este servicio solo, con product-service aparte. En el docker-compose de la raíz
      # se usa http://product-service:8081 (red interna de Docker).
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL:-http://host.docker.internal:8081}
      CORS_ORIGINS: http://localhost:5173
    extra_hosts:
      - "host.docker.internal:host-gateway"   # necesario en Linux; en Windows/Mac Docker Desktop ya lo trae
    depends_on:
      db-pedidos:
        condition: service_healthy

volumes:
  pgdata-pedidos:
