services:
  db-productos:
    image: postgres:16
    container_name: db-productos
    environment:
      POSTGRES_DB: db_productos
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata-productos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d db_productos"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-service:
    build: .
    container_name: product-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://db-productos:5432/db_productos
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db-productos:
        condition: service_healthy

volumes:
  pgdata-productos:
