spring.application.name=product-service
server.port=8081

# Base de datos (en Docker se sobreescribe con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_productos}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# CORS: solo mientras React llame directo a este servicio (se quita al poner el Gateway)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

springdoc.swagger-ui.path=/swagger-ui.html
