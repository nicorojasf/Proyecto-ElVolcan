spring.application.name=product-service
server.port=8081

# Base de datos (en Docker se sobreescribe con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_productos}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# CORS: orígenes del frontend que pueden llamar a este servicio
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

springdoc.swagger-ui.path=/swagger-ui.html

# JWT: se verifica con el MISMO secreto con que auth-service firma. Sin valor por defecto a propósito.
jwt.secret=${JWT_SECRET}

# Clave compartida con order-service para descontar/aumentar stock. Sin valor por defecto a propósito.
app.internal.key=${INTERNAL_API_KEY}
