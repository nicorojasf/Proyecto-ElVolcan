# Perfil "dev": base de datos en memoria. No necesita Docker ni PostgreSQL.
# Los datos se borran al apagar el servicio y se vuelven a cargar al iniciar.
spring.datasource.url=jdbc:h2:mem:db_productos;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

