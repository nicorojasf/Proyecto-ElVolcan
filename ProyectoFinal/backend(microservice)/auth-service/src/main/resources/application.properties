spring.application.name=auth-service
server.port=8082

# Base de datos (en Docker se sobreescribe con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_usuarios}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT. Sin valor por defecto a propósito: si falta JWT_SECRET el servicio no arranca.
# Los otros servicios deben usar exactamente el mismo secreto para validar los tokens.
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Cuenta admin inicial (opcional: si no se definen, no se crea)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.nombre=${ADMIN_NOMBRE:Administrador}

# Cuenta vendedor inicial (opcional)
app.vendedor.email=${VENDEDOR_EMAIL:}
app.vendedor.password=${VENDEDOR_PASSWORD:}

# CORS: orígenes del frontend que pueden llamar a este servicio
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

springdoc.swagger-ui.path=/swagger-ui.html
