<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administrador - Gas El Volcán</title>

    <!-- Ícono de la pestaña -->
    <link rel="shortcut icon" href="imagenes/gas.png" type="image/png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Hoja de Estilos Personalizada -->
    <link rel="stylesheet" href="css/estilos.css">

    <!-- Chart.js para los gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- JavaScipt -->
    <script src="js/app.js"></script>
</head>
<body style="background-color: #f4f0ea;">
    <header class="bg-header-principal shadow-sm">
        <div class="container-fluid px-3 d-flex align-items-center justify-content-between h-100">
            <div class="d-flex align-items-center gap-3">
                <a href="index.html">
                    <img src="imagenes/gas.png" alt="Gas El Volcán" class="logo-header-unico">
                </a>
                <span class="badge bg-warning text-dark fw-bold uppercase px-2 py-1">Panel Administrador</span>
            </div>

            <div class="d-flex align-items-center gap-3">
                <div class="text-white text-end d-none- d-sm-block">
                    <small class="d-block opacity-75">Sesión iniciada</small>
                    <strong class="small">admin@admin.com</strong>
                </div>
                <a href="login.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
                    <i class="bi bi-box-arrow-right me-1"></i> Salir
                </a>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container-fluid py-4 px-md-4">

        <!-- Titulo y barra superior -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-2">
            <div>
                <h2 class="fw-bold text-dark mb-0">Resumen de ventas y rendimiento</h2>
                <p class="text-muted small mb-0">Metricas actualizadas al día de hoy</p>
            </div>
            <button class="btn btn-primary shadow-sm rounded-pill px-3" onclick="window.print()">
                <i class="bi bi-printer me-1"></i> Exportar Reporte
            </button>
        </div>

        <!-- TARJETAS METRICAS (KPIs) -->

    </main>
</body>
</html>
